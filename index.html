<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Shopping Game</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { margin-top: 0; color: #333; }
        
        /* Items Grid & Cards Styling */
        .items-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; max-height: 400px; overflow-y: auto; padding: 5px; }
        .item-card { 
            border: 2px solid #e0e0e0; 
            border-radius: 8px; 
            padding: 10px; 
            text-align: center; 
            cursor: pointer; 
            transition: 0.2s; 
            background: #fff;
            color: #333;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 100px;
        }
        .item-card:hover { border-color: #007bff; }
        .item-card.selected { border-color: #007bff; background: #e7f1ff; }
        .item-card.out-of-stock { opacity: 0.4; cursor: not-allowed; background: #f5f5f5; }
        
        .item-title { font-weight: bold; font-size: 0.9rem; margin-bottom: 4px; display: block; word-break: break-word; }
        .item-price { color: #28a745; font-weight: 600; margin-bottom: 6px; display: block; }
        .badge { background: #007bff; color: white; padding: 2px 8px; border-radius: 10px; font-size: 0.75em; align-self: center; }
        
        /* Wheel Canvas */
        #wheelCanvas { width: 100%; max-width: 300px; height: auto; display: block; margin: 0 auto; }
        button { background: #28a745; color: white; border: none; padding: 10px 20px; font-size: 1rem; border-radius: 6px; cursor: pointer; width: 100%; margin-top: 10px; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        
        /* Teacher Dashboard */
        .teacher-panel { grid-column: span 2; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f8f9fa; }
        .correct { color: green; font-weight: bold; }
        .wrong { color: red; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <!-- Student Input & Item Selection -->
    <div class="card">
        <h2>1. Choose an Item</h2>
        <input type="text" id="studentName" placeholder="Enter your name..." style="width: 100%; padding: 8px; margin-bottom: 10px;">
        <div class="items-grid" id="itemsList"></div>
    </div>

    <!-- Wheel & Calculation -->
    <div class="card">
        <h2>2. Spin & Calculate</h2>
        <canvas id="wheelCanvas" width="300" height="300"></canvas>
        <button id="spinBtn" onclick="spinWheel()">Spin Wheel</button>
        
        <div id="calcSection" style="margin-top: 15px; display: none;">
            <p><strong>Selected Item:</strong> <span id="selectedItemName">-</span> ($<span id="selectedItemPrice">0</span>)</p>
            <p><strong>Wheel Result:</strong> <span id="wheelResultText">-</span></p>
            <label>Your Calculated Final Price ($):</label>
            <input type="text" id="studentAnswer" placeholder="0.00" style="width: 100%; padding: 8px; margin-top: 5px;">
            <button onclick="submitAnswer()" style="background: #007bff; margin-top: 10px;">Submit Answer</button>
        </div>
        <div id="feedback" style="margin-top: 10px; font-weight: bold; text-align: center;"></div>
    </div>

    <!-- Teacher Live Dashboard -->
    <div class="card teacher-panel">
        <h2>
            Teacher Dashboard (Live Submissions) 
            <button onclick="fetchData()" style="width: auto; padding: 5px 10px; font-size: 0.8rem;">🔄 Refresh</button>
            <button onclick="resetAllData()" style="background: #dc3545; width: auto; padding: 5px 10px; font-size: 0.8rem; margin-left: 10px;">🗑️ Reset All Data</button>
        </h2>
        <table>
            <thead>
                <tr>
                    <th>Student Name</th>
                    <th>Item</th>
                    <th>Original Price</th>
                    <th>Rule</th>
                    <th>Student Answer</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="dashboardBody"></tbody>
        </table>
    </div>
</div>

<script>
    // --- 1. CONFIGURATION ---
    const BIN_ID = "6a702ebef5f4af5e29e3a2a0";
    const API_KEY = "$2a$10$GE4N2XeGa6JxUbuB5bQ0eOUzdj97wKhL0O8bzPYjQ8DVWzwjB57Wi";
    const API_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

    // --- 2. ALL 48 ITEMS WITH CUSTOM STARTING QUANTITIES ---
    const initialItems = [
        // Sports & Fitness
        { id: 1, name: "Sports Water Bottle", price: 12.00, qty: 0 },
        { id: 2, name: "Football", price: 20.00, qty: 0 },
        { id: 3, name: "Basketball", price: 28.00, qty: 0 },
        { id: 4, name: "Badminton Racket", price: 24.90, qty: 0 },
        { id: 5, name: "Sports Shoes", price: 49.90, qty: 0 },
        { id: 6, name: "Shuttlecock (6 pcs)", price: 8.90, qty: 0 },
        { id: 7, name: "Energy Bar", price: 2.20, qty: 0 },
        { id: 8, name: "Isotonic Drink (500ml)", price: 2.50 },

        // Art Studio
        { id: 9, name: "Sketchbook", price: 3.20, qty: 0 },
        { id: 10, name: "Colour Pencils (12 colours)", price: 6.90 },
        { id: 11, name: "Watercolor Paint Set", price: 12.90 },
        { id: 12, name: "Paint Brushes (5 pcs)", price: 5.90 },
        { id: 13, name: "Acrylic Paint Set", price: 15.90 },
        { id: 14, name: "Artist Palette", price: 3.50 },
        { id: 15, name: "Drawing Pencil Set", price: 7.90 },
        { id: 16, name: "Eraser", price: 0.90 },

        // Stationery
        { id: 17, name: "Ball Pen", price: 1.20 },
        { id: 18, name: "Gel Pen", price: 2.00, qty: 0 },
        { id: 19, name: "Mechanical Pencil", price: 2.50, qty: 1 },
        { id: 20, name: "Highlighter", price: 1.80 },
        { id: 21, name: "Notebook A5", price: 2.50 },
        { id: 22, name: "Sticky Notes", price: 2.20 },
        { id: 23, name: "Scissors", price: 4.50 },
        { id: 24, name: "Glue Stick", price: 2.00 },

        // Snacks & Drinks
        { id: 25, name: "Pocky", price: 2.20, qty: 0 },
        { id: 26, name: "Oreo Cookies", price: 2.80, qty: 0 },
        { id: 27, name: "Cup Noodles", price: 2.00, qty: 0 },
        { id: 28, name: "Yeo's Mango Drink", price: 1.60 },
        { id: 29, name: "Potato Chips", price: 3.20, qty: 0 },
        { id: 30, name: "Chocolate Bar", price: 2.50, qty: 0 },
        { id: 31, name: "Juice Box", price: 1.50, qty: 1 },
        { id: 32, name: "Bottled Water", price: 1.20 },

        // Fun & Play
        { id: 33, name: "Rubik's Cube", price: 12.90 },
        { id: 34, name: "UNO Cards", price: 11.90, qty: 0 },
        { id: 35, name: "Game Controller", price: 39.90, qty: 0 },
        { id: 36, name: "Dinosaur Toy", price: 15.90, qty: 0 },
        { id: 37, name: "Puzzle (500 pcs)", price: 16.90 },
        { id: 38, name: "Building Blocks", price: 24.90 },
        { id: 39, name: "Playing Cards", price: 3.90 },
        { id: 40, name: "Collectible Figure", price: 14.90, qty: 0 },

        // Grocery Essentials
        { id: 41, name: "Apples (4 pcs)", price: 4.90 },
        { id: 42, name: "Oranges (4 pcs)", price: 5.20 },
        { id: 43, name: "Bananas (1 bunch)", price: 3.50, qty: 0 },
        { id: 44, name: "Carrots (500g)", price: 2.20, qty: 0 },
        { id: 45, name: "Broccoli", price: 2.80 },
        { id: 46, name: "Eggs (10 pcs)", price: 4.80 },
        { id: 47, name: "Rice (5kg)", price: 12.90 },
        { id: 48, name: "Cooking Oil (2L)", price: 9.90 }
    ];

    // --- 3. WHEEL OPTIONS ---
    const wheelOptions = [
        { label: "50% discount", type: "discount", val: 0.50 },
        { label: "20% discount", type: "discount", val: 0.20 },
        { label: "15% discount", type: "discount", val: 0.15 },
        { label: "10% discount", type: "discount", val: 0.10 },
        { label: "5% discount", type: "discount", val: 0.05 },
        { label: "5% GST", type: "gst", val: 0.05 },
        { label: "9% GST", type: "gst", val: 0.09 },
        { label: "10% GST", type: "gst", val: 0.10 }
    ];

    let selectedItem = null;
    let selectedRule = null;
    let hasSpun = false; 
    let dbData = { inventory: {}, submissions: [] };

    // Helper to get initial stock limit for an item
    function getDefaultQty(item) {
        return (item.qty !== undefined) ? item.qty : 2;
    }

    // --- 4. RENDER FUNCTIONS ---
    function renderItems() {
        const listDiv = document.getElementById('itemsList');
        if (!listDiv) return;
        
        listDiv.innerHTML = '';
        initialItems.forEach(item => {
            const defaultQty = getDefaultQty(item);
            const qty = (dbData.inventory && dbData.inventory[item.id] !== undefined) 
                ? dbData.inventory[item.id] 
                : defaultQty;
                
            const div = document.createElement('div');
            div.className = `item-card ${qty <= 0 ? 'out-of-stock' : ''} ${selectedItem?.id === item.id ? 'selected' : ''}`;
            
            div.innerHTML = `
                <span class="item-title">${item.name}</span>
                <span class="item-price">$${item.price.toFixed(2)}</span>
                <span class="badge">Qty: ${qty}</span>
            `;
            
            if (qty > 0) {
                div.onclick = () => {
                    selectedItem = item;
                    hasSpun = false; 
                    
                    document.getElementById('selectedItemName').innerText = item.name;
                    document.getElementById('selectedItemPrice').innerText = item.price.toFixed(2);
                    document.getElementById('calcSection').style.display = 'none';
                    document.getElementById('feedback').innerText = '';
                    document.getElementById('studentAnswer').value = '';
                    document.getElementById('spinBtn').disabled = false;
                    
                    renderItems();
                };
            }
            listDiv.appendChild(div);
        });
    }

    function renderDashboard() {
        const tbody = document.getElementById('dashboardBody');
        if (!tbody) return;
        tbody.innerHTML = '';
        const subs = dbData.submissions || [];
        [...subs].reverse().forEach(sub => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${sub.studentName}</td>
                <td>${sub.item}</td>
                <td>$${sub.originalPrice.toFixed(2)}</td>
                <td>${sub.rule}</td>
                <td>$${sub.studentAnswer.toFixed(2)}</td>
                <td class="${sub.isCorrect ? 'correct' : 'wrong'}">${sub.isCorrect ? 'SUCCESS ✅' : 'FAILED ❌'}</td>
            `;
            tbody.appendChild(row);
        });
    }

    // --- 5. SYNC WITH JSONBIN ---
    async function fetchData() {
        if (!BIN_ID) return;
        try {
            const res = await fetch(API_URL, {
                method: "GET",
                headers: { "X-Master-Key": API_KEY }
            });
            const data = await res.json();
            if (data.record) {
                dbData = data.record;
            }
        } catch (e) {
            console.error("Error fetching data:", e);
        } finally {
            renderItems();
            renderDashboard();
        }
    }

    async function saveData() {
        if (!BIN_ID) return;
        try {
            await fetch(API_URL, {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json",
                    "X-Master-Key": API_KEY
                },
                body: JSON.stringify(dbData)
            });
            fetchData();
        } catch (e) {
            console.error("Error saving data:", e);
        }
    }

    setInterval(fetchData, 3000);

    // --- 6. WHEEL DRAWING ---
    const canvas = document.getElementById('wheelCanvas');
    const ctx = canvas.getContext('2d');
    const colors = ['#FF6384', '#36A2EB', '#FFCE56', '#4BC0C0', '#9966FF', '#FF9F40', '#88D49E', '#E8A87C'];

    function drawWheel(angle = 0) {
        const numOptions = wheelOptions.length;
        const arc = (2 * Math.PI) / numOptions;
        ctx.clearRect(0, 0, 300, 300);

        for (let i = 0; i < numOptions; i++) {
            const sliceAngle = angle + i * arc;
            ctx.beginPath();
            ctx.fillStyle = colors[i];
            ctx.moveTo(150, 150);
            ctx.arc(150, 150, 140, sliceAngle, sliceAngle + arc);
            ctx.fill();

            ctx.save();
            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 12px Arial";
            ctx.translate(150 + Math.cos(sliceAngle + arc / 2) * 90, 150 + Math.sin(sliceAngle + arc / 2) * 90);
            ctx.rotate(sliceAngle + arc / 2 + Math.PI / 2);
            ctx.fillText(wheelOptions[i].label, -ctx.measureText(wheelOptions[i].label).width / 2, 0);
            ctx.restore();
        }
        
        ctx.fillStyle = "black";
        ctx.beginPath();
        ctx.moveTo(140, 10); ctx.lineTo(160, 10); ctx.lineTo(150, 30);
        ctx.fill();
    }

    function spinWheel() {
        if (!selectedItem) { alert("Please select an item first!"); return; }
        const studentName = document.getElementById('studentName').value.trim();
        if (!studentName) { alert("Please enter your name first!"); return; }
        if (hasSpun) { alert("You have already spun for this item. Select another item to spin again."); return; }

        document.getElementById('spinBtn').disabled = true;
        let startAngle = 0;
        let totalRotation = Math.PI * 2 * (4 + Math.random() * 4); 
        let duration = 3000;
        let startTime = null;

        function animateWheel(timestamp) {
            if (!startTime) startTime = timestamp;
            let progress = timestamp - startTime;
            let easeOut = Math.pow(progress / duration - 1, 3) + 1;
            let currentAngle = startAngle + easeOut * totalRotation;

            drawWheel(currentAngle);

            if (progress < duration) {
                requestAnimationFrame(animateWheel);
            } else {
                let finalAngle = currentAngle % (Math.PI * 2);
                let sliceArc = (2 * Math.PI) / wheelOptions.length;
                let winningIndex = Math.floor(((Math.PI * 2 - (finalAngle % (Math.PI * 2))) + Math.PI * 1.5) % (Math.PI * 2) / sliceArc);
                selectedRule = wheelOptions[winningIndex];

                hasSpun = true; 
                document.getElementById('wheelResultText').innerText = selectedRule.label;
                document.getElementById('calcSection').style.display = 'block';
                document.getElementById('feedback').innerText = '';
            }
        }
        requestAnimationFrame(animateWheel);
    }

    // --- 7. SUBMISSION & VERIFICATION ---
    async function submitAnswer() {
        const studentName = document.getElementById('studentName').value.trim();
        const rawInput = document.getElementById('studentAnswer').value.trim();
        const studentAns = parseFloat(rawInput);
        const feedbackEl = document.getElementById('feedback');

        if (isNaN(studentAns) || rawInput === "") { 
            alert("Please enter a valid price!"); 
            return; 
        }

        if (rawInput.includes('.')) {
            const decimalPlaces = rawInput.split('.')[1].length;
            if (decimalPlaces !== 2) {
                feedbackEl.innerText = "⚠️ Please express your answer as a whole number or with 2 decimal places (e.g., $12 or $12.50, not $12.5).";
                feedbackEl.style.color = "orange";
                return;
            }
        }

        let correctPrice = selectedItem.price;
        if (selectedRule.type === 'discount') {
            correctPrice = correctPrice * (1 - selectedRule.val);
        } else {
            correctPrice = correctPrice * (1 + selectedRule.val);
        }
        
        // Number.EPSILON prevents JavaScript floating-point rounding errors
        correctPrice = Math.round((correctPrice + Number.EPSILON) * 100) / 100;

        const isCorrect = Math.abs(studentAns - correctPrice) < 0.001;

        if (isCorrect) {
            feedbackEl.innerText = "🎉 Correct! Good job!";
            feedbackEl.style.color = "green";

            const defaultQty = getDefaultQty(selectedItem);
            const currentQty = (dbData.inventory && dbData.inventory[selectedItem.id] !== undefined) 
                ? dbData.inventory[selectedItem.id] 
                : defaultQty;
            
            if (!dbData.inventory) dbData.inventory = {};
            dbData.inventory[selectedItem.id] = Math.max(0, currentQty - 1);
        } else {
            feedbackEl.innerText = `❌ Incorrect amount. Please try again!`;
            feedbackEl.style.color = "red";
        }

        if (!dbData.submissions) dbData.submissions = [];
        dbData.submissions.push({
            studentName,
            item: selectedItem.name,
            originalPrice: selectedItem.price,
            rule: selectedRule.label,
            studentAnswer: studentAns,
            isCorrect,
            timestamp: Date.now()
        });

        await saveData();
    }

    // --- 8. TEACHER RESET FUNCTION ---
    async function resetAllData() {
        const password = prompt("Enter Teacher Password to reset:");
        if (password === "reset2026") { 
            if (confirm("Are you sure you want to reset all item quantities back to their initial levels and clear all student submissions?")) {
                dbData = { inventory: {}, submissions: [] };
                await saveData();
                alert("Game reset successfully!");
            }
        } else if (password !== null) {
            alert("Incorrect password!");
        }
    }

    // INITIAL STARTUP
    renderItems();
    drawWheel();
    fetchData();
</script>

</body>
</html>
